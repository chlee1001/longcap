<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame fixture</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; min-height: 1200px; font: 20px sans-serif; }
section { height: 200px; padding: 24px; border: 3px solid #222; }
section:nth-child(odd) { background: #afd9ef; }
section:nth-child(even) { background: #f4cc8d; }
</style>
</head>
<body>
<section id="frame-cell-1">Frame cell 1</section>
<section id="frame-cell-2">Frame cell 2</section>
<section id="frame-cell-3">Frame cell 3</section>
<section id="frame-cell-4">Frame cell 4</section>
<section id="frame-cell-5">Frame cell 5</section>
<section id="frame-cell-6">Frame cell 6</section>
</body>
</html>
