<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LongCap</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main class="popup-content">
      <header>
        <h1>LongCap</h1>
        <p>현재 활성 탭에서 페이지 전체 또는 선택한 영역을 캡처합니다.</p>
      </header>
      <div class="button-stack">
        <button id="capturePage" class="primary" type="button">
          페이지 전체 캡처 <span class="kbd-hint">C</span>
        </button>
        <button id="captureElement" type="button">
          영역 선택 캡처 <span class="kbd-hint">E</span>
        </button>
        <button id="openLibrary" type="button">
          보관함 열기 <span class="kbd-hint">L</span>
        </button>
      </div>
      <label class="file-label" for="importPdfInput">PDF 가져오기</label>
      <input id="importPdfInput" type="file" accept="application/pdf" />
      <div id="notice" role="alert" aria-live="assertive"></div>
      <section id="jobPanel" class="job-panel" aria-label="캡처 작업" hidden>
        <div id="jobState" role="status" aria-live="polite"></div>
        <progress
          id="jobProgress"
          max="100"
          value="0"
          aria-label="캡처 진행률"
        ></progress>
        <div class="button-row">
          <button id="jobPause" type="button">일시정지</button
          ><button id="jobResume" type="button">계속</button
          ><button id="jobCancel" type="button">취소</button>
        </div>
      </section>
      <footer>로컬 저장 · 계정 없음</footer>
    </main>
  </body>
</html>
